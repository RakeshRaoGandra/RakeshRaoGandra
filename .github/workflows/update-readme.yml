
name: Update Profile README Daily

on:
  schedule:
    # Every day at 09:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README date and recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: RakeshRaoGandra
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          username = os.environ["GITHUB_USERNAME"]
          readme_path = Path("README.md")
          content = readme_path.read_text(encoding="utf-8")

          ist = timezone(timedelta(hours=5, minutes=30))
          today = datetime.now(ist).strftime("%d %B %Y, %I:%M %p IST")

          def replace_section(text, start, end, replacement):
              if start not in text or end not in text:
                  raise ValueError(f"Missing README markers: {start}, {end}")

              before, remainder = text.split(start, 1)
              _, after = remainder.split(end, 1)
              return before + start + "\n" + replacement + "\n" + end + after

          # Update the date.
          content = replace_section(
              content,
              "<!-- DAILY-UPDATE-START -->",
              "<!-- DAILY-UPDATE-END -->",
              f"**Last updated:** {today}"
          )

          # Fetch public recent events from GitHub.
          url = (
              f"https://api.github.com/users/{username}/events/public"
              "?per_page=10"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Profile-README-Updater",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  events = json.load(response)

              lines = []
              for event in events:
                  event_type = event.get("type", "")
                  repo = event.get("repo", {}).get("name", "")
                  created = event.get("created_at", "")

                  if not repo:
                      continue

                  try:
                      event_date = datetime.fromisoformat(
                          created.replace("Z", "+00:00")
                      ).astimezone(ist).strftime("%d %b %Y")
                  except ValueError:
                      event_date = "Recent"

                  if event_type == "PushEvent":
                      commits = event.get("payload", {}).get("commits", [])
                      count = len(commits)
                      description = f"Pushed {count} commit(s)"
                  elif event_type == "CreateEvent":
                      description = "Created a branch or repository"
                  elif event_type == "PullRequestEvent":
                      action = event.get("payload", {}).get("action", "")
                      description = f"Pull request: {action}"
                  elif event_type == "IssuesEvent":
                      action = event.get("payload", {}).get("action", "")
                      description = f"Issue: {action}"
                  elif event_type == "WatchEvent":
                      description = "Starred a repository"
                  else:
                      description = event_type.removesuffix("Event")

                  repo_url = f"https://github.com/{repo}"
                  lines.append(
                      f"- **{event_date}** — {description} in "
                      f"[{repo}]({repo_url})"
                  )

              activity = (
                  "\n".join(lines[:10])
                  if lines
                  else "No recent public GitHub activity was found."
              )

          except Exception as error:
              print(f"Could not fetch recent activity: {error}")
              activity = (
                  "Recent activity could not be loaded. "
                  "Check back after the next successful run."
              )

          content = replace_section(
              content,
              "<!-- RECENT-ACTIVITY-START -->",
              "<!-- RECENT-ACTIVITY-END -->",
              activity
          )

          readme_path.write_text(content, encoding="utf-8")
          print("README updated successfully.")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update profile README daily"
            git push
          fi
